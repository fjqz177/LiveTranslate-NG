# pyappify 分发配置（LiveTranslate-NG）。
#
# 三件独立的事，正好是 pyappify 原生模型：
#   ① 软件源码  —— git-tag 秒级更新（pyappify 只换 working/，依赖不动）
#   ② 依赖环境  —— 由 pyappify 幂等装齐（pure-uv 分支用 uv python install +
#      uv pip install 消费本 yml 的 requirements-full-*.txt（uv export hash 锁定））
#   ③ 变体切换  —— cpu/gpu 两个 profile，pyappify 切 profile = 重装 torch 变体
#
# 第一个 profile 是「缺省兜底」：pyappify 更新/取当前 profile 时，名字找不到就回退到第一个
#   profile。命名可自定义（这里用 "cpu"/"gpu"，就是用户在 launcher 上看到的变体名），
#   不强制叫 "default"——官方 runtime 更新时用 current_profile 优先、仅兜底回第一个 profile
#   （app_service.rs 的 get_profile 已 fold 到 profiles.first()）。代码更新时 requirements
#   不变化 => 不触发重 pip => 绕开 pyappify 的 default-profile 更新 bug。
# 引擎的 cpu/gpu 是"硬件变体"，不是"引擎选择"——装满后所有引擎（SenseVoice-ONNX /
#   Whisper / FunASR / Anime-Whisper）都可用，App 永不管理引擎；模型仍由 App 单独下载。
#
# 图标：launcher 卡片图标用 png（webview 渲染 ico 不可靠），见 icon 字段；exe/安装器图标由
#   仓库根目录 icons/icon.ico + icons/icon.png 提供给 pyappify-action（其会整个拷到 runtime
#   src-tauri/icons/）。本文件 icon 与根 icons/ 是两套，勿混。

name: "LiveTranslate"
icon: "assets/icons/app.png"             # launcher 卡片图标（png；app 的 git 工作目录内路径）
website: "https://github.com/fjqz177/LiveTranslate-NG"

profiles:
  - name: "cpu"                          # CPU 变体（= 标准版，launcher 上显示 "cpu"）
    git_url: "https://github.com/fjqz177/LiveTranslate-NG"     # 需 vX.Y.Z semver tag
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements-full-cpu.txt"                  # base + funasr + whisper（torch cpu）
    # 不写 pip_args：主 pypi 镜像（含 CPU torch）交给用户在 pyappify 设置里选
    # （内置 PyPI官方/清华/阿里/USTC/华为/腾讯）。写死 --index-url 会绕过该选择
    # （python_env.rs 只在 pip_args 不含 --index-url/-i 时才用用户所选镜像）。
    use_pythonw: true
    show_add_defender: true

  - name: "gpu"                          # 可切换的 GPU 变体（torch cu126 + cuda 库）
    requirements: "requirements-full-gpu.txt"
    # 不写 --index-url/-i：主 pypi 镜像交给用户在 pyappify 设置里选。torch/cuda 的
    # cu126 不在那些 pypi 镜像里，故用 --extra-index-url 补；其 URL 用占位符
    # {PIP_TORCH_INDEX_URL}，由 pyappify runtime 展开成用户所选 torch 源（官方/
    # 南大，compat_manager 的 "Pip Torch Index URL"），官方与南大 wheel hash 一致
    # （requirements-full-gpu.txt 由 pyproject explicit cu126 生成，装机校验通过）。
    pip_args: "--extra-index-url {PIP_TORCH_INDEX_URL}"
