name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Windows-only: sync (CPU torch) + the full pytest gate.
    # PyAudioWPatch ships Windows-only wheels, so non-Windows syncs fail.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full-install model (2026-09-01): engines ship with the app as base deps,
      # so no separate --extra engine-* flags. CPU torch keeps the CI cache
      # small; unsafe-best-match lets non-torch packages resolve from PyPI while
      # torch is routed to the CPU PyTorch index via [tool.uv.sources].
      - name: Sync environment (CPU torch)
        run: uv sync --locked --index "pytorch=https://download.pytorch.org/whl/cpu" --index-strategy unsafe-best-match

      # Authoritative gate — the SAME command a human/agent runs locally.
      # It covers lock --check + ruff + format + mypy + pytest, so CI and the
      # local gate cannot diverge (single implementation, single source of truth).
      - name: Quality gate
        run: uv run livetranslate-pr
