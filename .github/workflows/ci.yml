name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Windows-only: sync (CPU torch) + the full pytest gate.
    # PyAudioWPatch ships Windows-only wheels, so non-Windows syncs fail.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full-install model (2026-09-01): engines ship with the app as base deps,
      # so no separate --extra engine-* flags (they are optional-dependencies,
      # installed on the END-USER machine by pyappify, not in the dev env).
      # NOTE: no index overrides anywhere here — uv.lock is pinned against the
      # Tsinghua/NJU mirrors, and `--locked` fast-checks the lock without network
      # but re-resolves (and can fail with "needs update") if any index is
      # overridden. Install straight from the lock's own index.
      - name: Sync environment
        run: uv sync --locked

      # Authoritative gate — the SAME command a human/agent runs locally.
      # It covers lock --check + ruff + format + mypy + pytest, so CI and the
      # local gate cannot diverge (single implementation, single source of truth).
      - name: Quality gate
        run: uv run livetranslate-pr
