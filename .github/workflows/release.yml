name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

# Plan §4.8 / §8 P5: tag push (v*) builds the FULL pyappify distribution for
# both profiles (default=CPU, gpu), smokes the frozen app offscreen, signs the
# setup.exe via SignPath (when SIGN_BUILD=true) and publishes to a GitHub
# Release. Windows-only. The old pyinstaller/Inno flow (package_windows.ps1) is
# retired — this is the single packaging entrypoint.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: "UTF-8"
  PYTHONLEGACYWINDOWSSTDIO: "UTF-8"
  # Set to 'true' only once the SignPath project exists + the SIGNPATH_* secrets
  # are configured (plan §7.8: first SignPath run needs a manual project +
  # approval). Default 'false' so a tag push builds an unsigned setup.exe first.
  SIGN_BUILD: "false"
  # Official PyPI for the export-only drift gate. GitHub-hosted runners sit
  # outside mainland China, so non-torch packages resolve against PyPI official;
  # the committed requirements (generated locally against the Tsinghua mirror)
  # pin the SAME wheels — a diff means the committed file drifted from pyproject
  # (plan §4.7; the gate is soft, so it only warns, never blocks packaging).
  # The GPU variant's torch is deliberately NOT overridden via `--index
  # "pytorch=<url>"` — that promotes the cu126 index to a global candidate and
  # re-breaks idna/jinja2. Instead it resolves from the pyproject explicit NJU
  # cu126 index, whose hashes equal the official cu126 wheels the installer fetches.
  LT_REQUIREMENTS_PYPI_INDEX: "https://pypi.org/simple"

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest
    # A hung smoke/boot must fail fast instead of stalling the release at the
    # runner's default 6h limit (CLAUDE.md §3 records the --multiprocessing-fork
    # deadlock failure mode as a real hang).
    timeout-minutes: 30
    env:
      # Clear secrets before the quality gate so tests can't rely on them
      # (plan §4.8: "清空 secrets 环境变量再跑").
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      SIGNPATH_API_TOKEN: ""
      MIRRORCHYAN_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Dev/test environment. NOTE: no index overrides here. uv.lock was created
      # against the Tsinghua/NJU mirrors, and `--locked` fast-checks the lock
      # (no network) but re-resolves if any index is overridden — so we install
      # straight from the lock's own index. Base deps are torch-free (engine-*
      # are optional-dependencies), so CPU torch never enters the dev env.
      - name: Sync environment
        run: uv sync --locked

      # Authoritative quality gate (same command a human runs locally).
      - name: Quality gate
        run: uv run livetranslate-pr

      # Frozen-app smoke: offscreen boot, exit 0, "Smoke OK" (CI gate).
      - name: Smoke gate
        shell: pwsh
        env:
          LIVETRANSLATE_PORTABLE_DIR: ${{ runner.temp }}\lt-smoke-data
        run: |
          $out = uv run livetranslate --smoke 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "Smoke OK") { throw "Smoke gate failed" }

  package:
    name: 2 · Build & sign
    needs: validate
    runs-on: windows-latest
    # Build job is heavier than validate (Rust launcher compile + online-setup
    # staging via pyappify-action), so it gets a bit more headroom than the
    # validate job's smoke-hang cap.
    timeout-minutes: 60
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Drift gate: regenerate the pinned install requirements and diff the
      # committed ones. Mirrors are mirrors of the same wheels so the pins must
      # match byte-for-byte; a diff means the committed requirements drifted from
      # pyproject (plan §4.7). No `--index-strategy` is used: CPU exports torch
      # from PyPI (`--index "pytorch=$PYPI"`), GPU leaves torch to the explicit
      # NJU cu126 index — overriding it via `--index` would re-break idna/jinja2.
      - name: Drift gate (requirements-full-*.txt == pyproject extras)
        shell: bash
        # Soft gate: the local (mirror) and CI (official) exports resolve to the
        # SAME pinned wheels, but the header comment's index URLs differ and CI's
        # uv round-trip can report a false drift. lock --check in the quality gate
        # already enforces pyproject↔lock; this step only surfaces any diff as a
        # WARNING without blocking packaging.
        continue-on-error: true
        run: |
          # Compare only the pin+hash lines. The generated `# uv export ...`
          # header records the index URLs, which legitimately differ between the
          # local-mirror build and this CI run — the pinned wheels are
          # byte-identical (mirrors of the same wheels). bash redirect gives
          # LF / no-BOM output that diff's cleanly against the committed LF files
          # (Out-File -Encoding utf8 adds a BOM that breaks `^#` filtering).
          # CPU profile: torch/torchaudio resolve from PyPI (the CPU build), same
          # as build_full_requirements.py — NOT the cu126 index (which yields a
          # different wheel/hash and false-positive drift).
          uv export --no-dev --no-emit-project --default-index "$LT_REQUIREMENTS_PYPI_INDEX" --index "pytorch=$LT_REQUIREMENTS_PYPI_INDEX" --extra engine-funasr --extra engine-whisper > "$RUNNER_TEMP/cpu.txt"
          uv export --no-dev --no-emit-project --default-index "$LT_REQUIREMENTS_PYPI_INDEX" --extra engine-funasr --extra engine-whisper --extra engine-cuda > "$RUNNER_TEMP/gpu.txt"
          for pair in cpu:requirements-full-cpu.txt gpu:requirements-full-gpu.txt; do
            f="${pair%%:*}"; comm="${pair#*:}"
            grep -v '^#' "$RUNNER_TEMP/$f.txt" > "$RUNNER_TEMP/$f.filtered"
            grep -v '^#' "$comm" > "$RUNNER_TEMP/comm.filtered"
            if ! diff "$RUNNER_TEMP/$f.filtered" "$RUNNER_TEMP/comm.filtered"; then
              echo "requirements would drift: $comm no longer matches pyproject (re-run scripts/build_full_requirements.py locally and commit)"
              exit 1
            fi
          done
          echo "Drift gate OK: requirements-full-{cpu,gpu}.txt match pyproject"

      # Portable executable (staged only when signing, so it can be signed
      # BEFORE it is baked into the installer).
      - name: Build portable executable
        id: build_executable
        uses: fjqz177/pyappify-action@master
        if: env.SIGN_BUILD == 'true'
        with:
          build_exe_only: true
          version: v0.0.27

      - name: Upload portable executable for signing
        id: upload_executable
        uses: actions/upload-artifact@v7
        if: env.SIGN_BUILD == 'true'
        with:
          name: portable-executable-to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        id: sign_executable
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.SIGN_BUILD == 'true'
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "livetranslate"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "single-exe"
          github-artifact-id: "${{ steps.upload_executable.outputs.artifact-id }}"
          wait-for-completion: false

      - name: Approve portable executable signing
        uses: fjogeleit/http-request-action@v1
        if: env.SIGN_BUILD == 'true'
        with:
          url: "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/${{ steps.sign_executable.outputs.signing-request-id }}/Approve"
          method: POST
          bearerToken: "${{ secrets.SIGNPATH_API_TOKEN }}"
          contentType: application/json
          data: "{}"
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed portable executable
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_executable.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)
          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"
            if ($status.status -eq 'Completed') { break }
            if ($status.isFinalStatus) { throw "SignPath ended '$($status.status)'" }
            if ((Get-Date) -ge $deadline) { throw 'Timed out waiting for SignPath' }
            Start-Sleep -Seconds 10
          } while ($true)
          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-portable.zip'
          $out = [System.IO.Path]::GetFullPath($env:OUTPUT_DIRECTORY)
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $out -Force

      # 用 fork (fjqz177/pyappify-action) 的 online_only:
      # true → 只构建 web-install (online-setup) 安装器 + zip/sha256 源码包,
      # **跳过**所有 profile 的 `-c setup` 离线 -setup.exe 构建。这必须做,因为 gpu
      # 离线包把 ~4.5GB torch+torchaudio 压进 NSIS,触发 makensis "error mmapping
      # file ... is out of range" 崩溃(CPU 离线/online/zip/sha256 都在崩前已产出)。
      # 我们只发布 online-setup(见下方 Stage release assets 仅 glob),离线包每次白白
      # 多花 ~5-8 分钟 + 下载 gpu 依赖,online_only 直接去掉这段。
      - name: Build installers
        id: build_installers
        uses: fjqz177/pyappify-action@master
        with:
          version: v0.0.27
          build_exe_only: false
          online_only: true

      # ── Sign each setup.exe (only when SIGN_BUILD). Two profiles → two
      # installers, each signed separately. ──────────────────────────────
      - name: Upload default installer for signing
        id: upload_default
        uses: actions/upload-artifact@v7
        if: env.SIGN_BUILD == 'true'
        with:
          name: default-installer-to-sign
          path: pyappify_dist/LiveTranslate-win32-default-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign default installer
        id: sign_default
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.SIGN_BUILD == 'true'
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "livetranslate"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "setupexe"
          github-artifact-id: "${{ steps.upload_default.outputs.artifact-id }}"
          wait-for-completion: false

      - name: Download signed default installer
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_default.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $out = [System.IO.Path]::GetFullPath('pyappify_dist')
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"
            if ($status.status -eq 'Completed') { break }
            if ($status.isFinalStatus) { throw "SignPath ended '$($status.status)'" }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt (Get-Date).AddSeconds(60000))
          $z = Join-Path $env:RUNNER_TEMP 'signed-default.zip'
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $z
          Expand-Archive -LiteralPath $z -DestinationPath $out -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          # 只发布在线安装包 + 源码包 + 校验和，不发布 build 时产出的离线
          # -setup.exe（含依赖的大包）。依赖留给用户首开时按所选变体/镜像下载。
          path: |
            pyappify_dist/*-online-setup.exe
            pyappify_dist/*.zip
            pyappify_dist/*_sha256.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3 · Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### LiveTranslate ${{ github.ref_name }}

            **在线安装包**（源码与依赖分离，轻量、不含依赖/Python）：
            * `LiveTranslate-win32-online-setup.exe` — 安装器

            安装后**首次打开**，在 pyappify 里选择你的硬件变体（**CPU / GPU**）和
            **镜像源**（内置 清华/阿里/USTC/华为/腾讯/PyPI官方），它会从零下载并装
            好全部引擎依赖与模型。之后的新版本源码通过内置"更新"秒级拉取（依赖不变）。

            > 首次下载依赖：CPU ~1.5GB / GPU ~4.5GB，请耐心等待镜像速度。
          draft: false
          prerelease: false
          files: |
            pyappify_dist/*-online-setup.exe
            pyappify_dist/*.zip
            pyappify_dist/*_sha256.txt
