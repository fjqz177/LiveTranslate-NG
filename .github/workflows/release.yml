name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

# Plan §4.8 / §8 P5: tag push (v*) builds the FULL pyappify distribution for
# both profiles (default=CPU, gpu), smokes the frozen app offscreen, signs the
# setup.exe via SignPath (when SIGN_BUILD=true) and publishes to a GitHub
# Release. Windows-only. The old pyinstaller/Inno flow (package_windows.ps1) is
# retired — this is the single packaging entrypoint.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: "UTF-8"
  PYTHONLEGACYWINDOWSSTDIO: "UTF-8"
  # Set to 'true' only once the SignPath project exists + the SIGNPATH_* secrets
  # are configured (plan §7.8: first SignPath run needs a manual project +
  # approval). Default 'false' so a tag push builds an unsigned setup.exe first.
  SIGN_BUILD: "false"
  # Official indexes for the export-only drift gate. GitHub-hosted runners are
  # outside mainland China, so the export here resolves against PyPI official /
  # PyTorch official; the committed requirements (generated locally against the
  # Tsinghua/NJU mirrors) pin the SAME wheels, so the diff must stay empty.
  LT_REQUIREMENTS_PYPI_INDEX: "https://pypi.org/simple"
  LT_REQUIREMENTS_PYTORCH_INDEX: "https://download.pytorch.org/whl/cu126"

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest
    env:
      # Clear secrets before the quality gate so tests can't rely on them
      # (plan §4.8: "清空 secrets 环境变量再跑").
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      SIGNPATH_API_TOKEN: ""
      MIRRORCHYAN_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Dev/test environment. NOTE: no index overrides here. uv.lock was created
      # against the Tsinghua/NJU mirrors, and `--locked` fast-checks the lock
      # (no network) but re-resolves if any index is overridden — so we install
      # straight from the lock's own index. Base deps are torch-free (engine-*
      # are optional-dependencies), so CPU torch never enters the dev env.
      - name: Sync environment
        run: uv sync --locked

      # Authoritative quality gate (same command a human runs locally).
      - name: Quality gate
        run: uv run livetranslate-pr

      # Frozen-app smoke: offscreen boot, exit 0, "Smoke OK" (CI gate).
      - name: Smoke gate
        shell: pwsh
        env:
          LIVETRANSLATE_PORTABLE_DIR: ${{ runner.temp }}\lt-smoke-data
        run: |
          $out = uv run livetranslate --smoke 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "Smoke OK") { throw "Smoke gate failed" }

  package:
    name: 2 · Build & sign
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Drift gate: regenerate the pinned install requirements with the official
      # indexes and diff the committed ones. Mirrors are mirrors of the same
      # wheels so the pins must match byte-for-byte; a diff means the committed
      # requirements drifted from pyproject (plan §4.7). `--index-strategy
      # unsafe-best-match` is required because the cu126 PyTorch mirror also
      # carries old non-torch packages (e.g. idna==3.4) that would otherwise
      # win by index order and break openai.
      - name: Drift gate (requirements-full-*.txt == pyproject extras)
        shell: pwsh
        run: |
          $pypi = $env:LT_REQUIREMENTS_PYPI_INDEX
          $pt = $env:LT_REQUIREMENTS_PYTORCH_INDEX
          uv export --no-dev --no-emit-project --default-index $pypi --index "pytorch=$pt" --index-strategy unsafe-best-match --extra engine-funasr --extra engine-whisper | Out-File -Encoding utf8 $env:RUNNER_TEMP\cpu.txt
          uv export --no-dev --no-emit-project --default-index $pypi --index "pytorch=$pt" --index-strategy unsafe-best-match --extra engine-funasr --extra engine-whisper --extra engine-cuda | Out-File -Encoding utf8 $env:RUNNER_TEMP\gpu.txt
          foreach ($pair in @(@("cpu","requirements-full-cpu.txt"),@("gpu","requirements-full-gpu.txt"))) {
            $gen = "$env:RUNNER_TEMP\$($pair[0]).txt"
            # Compare only the pin+hash lines. The `# uv export ...` header
            # comment records the index URLs, which legitimately differ between
            # a local mirror build and this CI run — the actual pinned wheels
            # are byte-identical (mirrors of the same wheels).
            $genLines = Get-Content $gen | Where-Object { $_ -notmatch '^\s*#' }
            $commLines = Get-Content $pair[1] | Where-Object { $_ -notmatch '^\s*#' }
            if (Compare-Object $genLines $commLines -SyncWindow 0) {
              throw "requirements would drift: $($pair[1]) no longer matches pyproject (re-run scripts/build_full_requirements.py locally and commit)"
            }
          }
          Write-Host "Drift gate OK: requirements-full-{cpu,gpu}.txt match pyproject"

      # Portable executable (staged only when signing, so it can be signed
      # BEFORE it is baked into the installer).
      - name: Build portable executable
        id: build_executable
        uses: ok-oldking/pyappify-action@master
        if: env.SIGN_BUILD == 'true'
        with:
          build_exe_only: true

      - name: Upload portable executable for signing
        id: upload_executable
        uses: actions/upload-artifact@v4
        if: env.SIGN_BUILD == 'true'
        with:
          name: portable-executable-to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        id: sign_executable
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.SIGN_BUILD == 'true'
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "livetranslate"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "single-exe"
          github-artifact-id: "${{ steps.upload_executable.outputs.artifact-id }}"
          wait-for-completion: false

      - name: Approve portable executable signing
        uses: fjogeleit/http-request-action@v1
        if: env.SIGN_BUILD == 'true'
        with:
          url: "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/${{ steps.sign_executable.outputs.signing-request-id }}/Approve"
          method: POST
          bearerToken: "${{ secrets.SIGNPATH_API_TOKEN }}"
          contentType: application/json
          data: "{}"
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed portable executable
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_executable.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)
          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"
            if ($status.status -eq 'Completed') { break }
            if ($status.isFinalStatus) { throw "SignPath ended '$($status.status)'" }
            if ((Get-Date) -ge $deadline) { throw 'Timed out waiting for SignPath' }
            Start-Sleep -Seconds 10
          } while ($true)
          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-portable.zip'
          $out = [System.IO.Path]::GetFullPath($env:OUTPUT_DIRECTORY)
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $out -Force

      # Build both installers (default + gpu). When signing, the exe was signed
      # above so it is baked signed into both; when not signing this is the only
      # build step.
      - name: Build installers
        id: build_installers
        uses: ok-oldking/pyappify-action@master
        with:
          build_exe_only: false

      # ── Sign each setup.exe (only when SIGN_BUILD). Two profiles → two
      # installers, each signed separately. ──────────────────────────────
      - name: Upload default installer for signing
        id: upload_default
        uses: actions/upload-artifact@v4
        if: env.SIGN_BUILD == 'true'
        with:
          name: default-installer-to-sign
          path: pyappify_dist/LiveTranslate-win32-default-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign default installer
        id: sign_default
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.SIGN_BUILD == 'true'
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "livetranslate"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "setupexe"
          github-artifact-id: "${{ steps.upload_default.outputs.artifact-id }}"
          wait-for-completion: false

      - name: Download signed default installer
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_default.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/${{ secrets.SIGNPATH_ORGANIZATION_ID }}/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $out = [System.IO.Path]::GetFullPath('pyappify_dist')
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"
            if ($status.status -eq 'Completed') { break }
            if ($status.isFinalStatus) { throw "SignPath ended '$($status.status)'" }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt (Get-Date).AddSeconds(60000))
          $z = Join-Path $env:RUNNER_TEMP 'signed-default.zip'
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $z
          Expand-Archive -LiteralPath $z -DestinationPath $out -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3 · Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### LiveTranslate ${{ github.ref_name }}

            Windows 安装包（双变体）：
            * `LiveTranslate-win32-default-setup.exe` — CPU 版（默认，装满全部引擎依赖）
            * `LiveTranslate-win32-gpu-setup.exe` — GPU 版（NVIDIA CUDA，torch cu126）

            装好后用内置"更新"即可秒级拉到新版本源码（依赖不变）。
            > 首次安装会在线拉取全部依赖（CPU ~1.5GB / GPU ~4.5GB），请耐心等待镜像下载。
          draft: false
          prerelease: false
          files: pyappify_dist/*
